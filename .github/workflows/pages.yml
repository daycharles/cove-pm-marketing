name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public website files
        shell: bash
        run: |
          mkdir -p public-site/assets/social
          cp index.html CNAME public-site/
          cp marketing-vault/Assets/social-catalog/images/AC-G005-unit-review.png public-site/assets/social/AC-G005-unit-review.png
          cp marketing-vault/Assets/social-catalog/images/AC-G003-resident-handover.png public-site/assets/social/AC-G003-resident-handover.png
          cp marketing-vault/Assets/social-catalog/images/AC-G006-resident-access.png public-site/assets/social/AC-G006-resident-access.png
          cp marketing-vault/Assets/social-catalog/images/AC-G007-rent-support-conversation.png public-site/assets/social/AC-G007-rent-support-conversation.png
          cp marketing-vault/Assets/social-catalog/images/AC-G008-resident-energy-engagement.png public-site/assets/social/AC-G008-resident-energy-engagement.png
          cp marketing-vault/Assets/social-catalog/images/AC-G009-iaq-communication.png public-site/assets/social/AC-G009-iaq-communication.png
          cp marketing-vault/Assets/social-catalog/images/AC-G010-waste-planning.png public-site/assets/social/AC-G010-waste-planning.png
          cp marketing-vault/Assets/social-catalog/images/AC-G011-team-recognition.png public-site/assets/social/AC-G011-team-recognition.png
          cp marketing-vault/Assets/social-catalog/images/AC-G012-energy-onboarding.png public-site/assets/social/AC-G012-energy-onboarding.png

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
