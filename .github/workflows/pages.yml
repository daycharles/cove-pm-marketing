name: Deploy Cove PM marketing site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      GITHUB_PAGES: "true"
      NEXT_DIST_DIR: .next-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Snapshot the public marketing route
        run: |
          npx next start --hostname 127.0.0.1 > /tmp/cove-pages.log 2>&1 &
          PAGES_PATH="/${GITHUB_REPOSITORY#*/}"
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000${PAGES_PATH}/website" >/dev/null; then
              break
            fi
            sleep 1
          done
          mkdir -p ../../site/website ../../site/_next
          curl -fsS "http://127.0.0.1:3000${PAGES_PATH}/website" > ../../site/index.html
          cp ../../site/index.html ../../site/website/index.html
          cp -R .next-pages/static ../../site/_next/static
          cp -R public/. ../../site/
          touch ../../site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
