name: LinkedIn Buffer pilot

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the QA-passed post (otherwise read-only dry run)
        required: true
        type: boolean
        default: false
      publish_now:
        description: Publish immediately instead of adding to the next queue slot
        required: true
        type: boolean
        default: false
      target_due_at:
        description: Optional exact schedule time in ISO 8601 UTC (overrides the next queue slot)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  BUFFER_CHANNEL_ID: 6abffd55ea19ca0bde57f126

jobs:
  run-pilot:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    concurrency:
      group: averion-linkedin-buffer-pilot
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install timezone data
        run: python -m pip install "tzdata>=2025.2"

      - name: Validate execution mode
        if: ${{ inputs.publish_now && !inputs.execute }}
        run: |
          echo "publish_now requires execute=true" >&2
          exit 1

      - name: Run read-only dry run
        if: ${{ !inputs.execute }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing-vault/agent-workbench/linkedin_buffer_runner.py --target-due-at "${{ inputs.target_due_at }}" --audit marketing-vault/agent-workbench/outputs/linkedin-buffer-audit.json

      - name: Add one eligible post to the queue
        if: ${{ inputs.execute && !inputs.publish_now }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing-vault/agent-workbench/linkedin_buffer_runner.py --execute --target-due-at "${{ inputs.target_due_at }}" --audit marketing-vault/agent-workbench/outputs/linkedin-buffer-audit.json

      - name: Publish one eligible post now
        if: ${{ inputs.execute && inputs.publish_now }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing-vault/agent-workbench/linkedin_buffer_runner.py --execute --publish-now --target-due-at "${{ inputs.target_due_at }}" --audit marketing-vault/agent-workbench/outputs/linkedin-buffer-audit.json

      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-buffer-audit-${{ github.run_id }}
          path: marketing-vault/agent-workbench/outputs/linkedin-buffer-audit.json
          if-no-files-found: warn
          retention-days: 90
